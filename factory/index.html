<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>MEEVEGGIES · ออเดอร์สำหรับ D'Nuts</title>
<meta name="theme-color" content="#151615">
<link rel="icon" type="image/png" href="../img/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --paper:#f3f4f1; --card:#fff; --ink:#151615; --muted:#5b605a; --rule:#d9dcd6; --soft:#eceee9;
  --pouch:#151615; --on-pouch:#f4f5f2; --on-pouch-muted:#b4b9b2;
  --line:#04773a; --shopee:#b8300f; --ok:#2f7a4a; --ok-bg:#e2f1e7; --warn:#8a5300; --warn-bg:#fbefd9; --info:#1f5fa8; --info-bg:#e3ecf8;
  --display:"Bai Jamjuree","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121312; --card:#1c1d1c; --ink:#eef0ec; --muted:#a3a8a1; --rule:#2f322f; --soft:#242624;
  --pouch:#0a0b0a; --line:#4fdc8c; --shopee:#ff8a6a; --ok:#6cc08b; --ok-bg:#16301f; --warn:#f0b24f; --warn-bg:#33270f; --info:#8db8ec; --info-bg:#16263a;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#121312; --card:#1c1d1c; --ink:#eef0ec; --muted:#a3a8a1; --rule:#2f322f; --soft:#242624;
  --pouch:#0a0b0a; --line:#4fdc8c; --shopee:#ff8a6a; --ok:#6cc08b; --ok-bg:#16301f; --warn:#f0b24f; --warn-bg:#33270f; --info:#8db8ec; --info-bg:#16263a;
  color-scheme:dark }
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
h1,h2{font-family:var(--display);margin:0}
.wrap{max-width:820px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{background:var(--pouch);color:var(--on-pouch)}
.top .wrap{padding-block:18px 16px;display:grid;gap:6px}
.top h1{font-size:22px;letter-spacing:.02em}
.top h1 span{color:var(--on-pouch-muted);font-size:14px;font-weight:600;letter-spacing:.1em;margin-left:8px}
.top p{color:var(--on-pouch-muted);font-size:14px;margin:0}
main{padding-block:20px 60px;display:grid;gap:18px}
.panel{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:18px;min-width:0}
.ph{display:flex;justify-content:space-between;align-items:baseline;gap:6px 12px;flex-wrap:wrap;margin-bottom:12px}
.ph h2{font-size:19px}
.ph p{color:var(--muted);font-size:13.5px;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:12px}
.stat b{display:block;font:600 30px/1.1 var(--mono);font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse}
td{padding:9px 0;border-bottom:1px solid var(--soft);vertical-align:top}
td.q{text-align:right;font:600 16px var(--mono);white-space:nowrap;padding-left:12px}
.sz{font-weight:600;font-size:13px;color:var(--muted);margin-left:4px}
.pill{display:inline-block;border-radius:999px;padding:0 9px;font-size:12px;font-weight:600;line-height:1.7;white-space:nowrap}
.pill.pre{background:var(--info-bg);color:var(--info)}
.pill.shopee{border:1px solid var(--shopee);color:var(--shopee)}
.pill.line{border:1px solid var(--line);color:var(--line)}
.pill.sample{background:var(--ok-bg);color:var(--ok)}
.orders{display:grid;gap:10px;list-style:none;margin:0;padding:0}
.order{border:1px solid var(--rule);border-radius:12px;padding:12px;background:var(--paper);display:grid;gap:6px;min-width:0}
.order.done{opacity:.55}
.ohead{display:flex;gap:6px 8px;align-items:center;flex-wrap:wrap}
.ohead .n{font:600 15px var(--mono)}
.ohead .ref{font-family:var(--mono);font-size:14px;overflow-wrap:anywhere}
.ohead label{margin-left:auto;display:flex;gap:6px;align-items:center;font-size:13.5px;color:var(--muted);cursor:pointer;min-height:32px}
.ohead input{width:20px;height:20px}
.oitems{margin:0;padding-left:18px;font-size:14.5px}
.note{font-size:13px;color:var(--muted)}
.banner{border-radius:12px;padding:10px 14px;font-size:14px;background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn)}
.empty{color:var(--muted)}
footer{color:var(--muted);font-size:12.5px}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <h1>MEEVEGGIES <span>ออเดอร์สำหรับ D'Nuts</span></h1>
    <p id="when">กำลังโหลด…</p>
  </div>
</header>
<main class="wrap" id="main">
  <p class="empty">กำลังโหลดออเดอร์…</p>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const itemLine = i => `${esc(i.name)}<span class="sz">${esc(i.size || "")}</span> × ${Number(i.q) || 0}${i.preorder ? ' <span class="pill pre">พรีออเดอร์</span>' : ""}`;

function packedKey(d){ return "packed-" + (d.date || ""); }
function loadPacked(d){ try{ return JSON.parse(localStorage.getItem(packedKey(d)) || "{}"); }catch(e){ return {}; } }
function savePacked(d, m){ try{ localStorage.setItem(packedKey(d), JSON.stringify(m)); }catch(e){} }

function render(d){
  const upd = d.updatedAt ? new Date(d.updatedAt).toLocaleString("th-TH", {timeZone:"Asia/Bangkok", dateStyle:"medium", timeStyle:"short"}) : "";
  $("#when").textContent = d.dateLabel ? `ออเดอร์วันที่ ${d.dateLabel}${upd ? " · อัปเดต " + upd : ""}` : (upd ? "อัปเดต " + upd : "");
  const list = Array.isArray(d.list) ? d.list : [];
  if(!list.length){
    $("#main").innerHTML = `<section class="panel"><h2>ยังไม่มีออเดอร์</h2><p class="empty" style="margin-top:8px">${esc(d.message || "วันนี้ยังไม่มีออเดอร์จาก MEEVEGGIES ค่ะ")}</p></section>`;
    return;
  }
  const packed = loadPacked(d);
  const packCount = (d.packs || []).reduce((s, p) => s + (Number(p.q) || 0), 0);
  const sampleCount = (d.samples || []).reduce((s, p) => s + (Number(p.q) || 0), 0);
  let html = "";
  if(d.status === "preview") html += `<div class="banner">ตัวอย่างเท่านั้น ยังไม่ใช่ออเดอร์จริง กรุณารอข้อความจาก MEEVEGGIES ทาง LINE ค่ะ</div>`;
  html += `<section class="panel"><div class="stats">
      <div class="stat"><b>${list.length}</b><span>ออเดอร์</span></div>
      <div class="stat"><b>${packCount}</b><span>แพ็ก</span></div>
      <div class="stat"><b>${sampleCount}</b><span>ซองทดลอง 15 กรัม</span></div>
    </div></section>`;
  html += `<section class="panel"><div class="ph"><h2>รวมแพ็ก</h2><p>ซองปิดผนึกของ D'Nuts</p></div><table><tbody>
    ${(d.packs || []).map(p => `<tr><td>${esc(p.name)}<span class="sz">${esc(p.size || "")}</span>${p.preorder ? ' <span class="pill pre">พรีออเดอร์</span>' : ""}</td><td class="q">× ${Number(p.q) || 0}</td></tr>`).join("")}
    </tbody></table>`;
  if((d.samples || []).length){
    html += `<div class="ph" style="margin-top:16px"><h2>ซองทดลอง 15 กรัม</h2><p>แถม 1 ซองต่อออเดอร์</p></div><table><tbody>
      ${d.samples.map(s => `<tr><td>${esc(s.name)}</td><td class="q">× ${Number(s.q) || 0}</td></tr>`).join("")}</tbody></table>`;
  }
  html += `</section>`;
  html += `<section class="panel"><div class="ph"><h2>แยกตามออเดอร์</h2><p>ติ๊กเมื่อแพ็กเสร็จ (บันทึกในเครื่องนี้เท่านั้น)</p></div><ol class="orders">
    ${list.map((o, i) => {
      const id = String(o.ref || i);
      const done = !!packed[id];
      const ch = o.channel === "line" ? '<span class="pill line">LINE</span>' : '<span class="pill shopee">Shopee</span>';
      return `<li class="order${done ? " done" : ""}" data-id="${esc(id)}">
        <div class="ohead"><span class="n">${i + 1})</span>${ch}<span class="ref">${esc(o.ref || "")}</span>
          <label><input type="checkbox" data-id="${esc(id)}"${done ? " checked" : ""}>แพ็กแล้ว</label></div>
        <ul class="oitems">${(o.items || []).map(it => `<li>${itemLine(it)}</li>`).join("")}</ul>
        ${o.sample ? `<div><span class="pill sample">แถมซองทดลอง ${esc(o.sample)} 15 กรัม</span></div>` : ""}
        ${o.channel === "line" ? `<div class="note">ชื่อและที่อยู่จัดส่งส่งให้ทาง LINE ค่ะ</div>` : ""}
      </li>`;
    }).join("")}</ol></section>`;
  html += `<footer>หน้านี้แสดงเฉพาะรายการสินค้า ข้อมูลลูกค้าและฉลากจัดส่งส่งให้ทาง LINE ค่ะ</footer>`;
  $("#main").innerHTML = html;
  $("#main").addEventListener("change", e => {
    const t = e.target; if(!t.dataset || !t.dataset.id) return;
    const m = loadPacked(d); if(t.checked) m[t.dataset.id] = 1; else delete m[t.dataset.id];
    savePacked(d, m);
    const li = t.closest(".order"); if(li) li.classList.toggle("done", t.checked);
  });
}

fetch("today.json?t=" + Date.now(), {cache:"no-store"})
  .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(render)
  .catch(() => { $("#when").textContent = ""; $("#main").innerHTML = `<section class="panel"><h2>โหลดออเดอร์ไม่ได้</h2><p class="empty" style="margin-top:8px">ลองรีเฟรชหน้านี้อีกครั้ง หรือดูข้อความจาก MEEVEGGIES ทาง LINE ค่ะ</p></section>`; });
</script>
</body>
</html>
